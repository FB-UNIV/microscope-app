<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- metallo.svg drawn for 16 to 24 px: a bigger field, a thinner barrel,
       one dark grain and three boundaries thick enough to survive. -->
  <defs>
    <radialGradient id="field" cx="0.40" cy="0.36" r="0.78">
      <stop offset="0" stop-color="#f3bf98"/>
      <stop offset="0.5" stop-color="#d48a5a"/>
      <stop offset="1" stop-color="#9a522b"/>
    </radialGradient>
    <clipPath id="fieldClip">
      <circle cx="128" cy="128" r="96"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="#222224"/>
  <circle cx="128" cy="128" r="112" fill="#0c0c0d"/>

  <g clip-path="url(#fieldClip)">
    <circle cx="128" cy="128" r="96" fill="url(#field)"/>
    <path d="M136 112 L176 20 L256 20 L256 132 Z" fill="#5a2a12"/>
    <g fill="none" stroke="#3a1906" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M136 112 L176 20"/>
      <path d="M136 112 L256 132"/>
      <path d="M136 112 L104 256"/>
      <path d="M118 190 L20 160"/>
    </g>
  </g>
</svg>
