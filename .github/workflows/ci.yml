name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, distro OpenCV)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libopencv-dev nlohmann-json3-dev python3 python3-numpy python3-opencv

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

      # Phase-analysis parity runs here on the in-repo legacy crops; the
      # full-size checks need the legacy TIFF archive (not in the repo), so
      # they print [SKIP] here and run locally with MSAPP_LEGACY_DATA_DIR.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ADR 0012: the numpy reference is a second, independent implementation
      # of the legacy algorithm. Its output on the in-repo crops is the golden
      # file test_phase_analysis reads, so a drift in either one fails here.
      - name: Check numpy reference against the golden file
        working-directory: tests/fixtures/legacy
        run: |
          python3 ../../../tools/legacy_phase_reference.py \
            CTTM1Ech1Vue1_crop256.png CTTM1Ech2Vue1_crop256.png CTTM1Ech3Vue1_crop256.png > "$RUNNER_TEMP/reference.txt"
          diff -u crops_reference.txt "$RUNNER_TEMP/reference.txt"

  windows:
    name: Windows (MSVC 2022, prebuilt OpenCV)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Pinned: this job also builds the camera_probe bundle shipped to lab
      # PCs, so OpenCV must not change between two runs. Bump on purpose.
      - name: Install OpenCV (official prebuilt binaries)
        run: choco install opencv --version 4.13.0 --no-progress -y

      - name: Locate OpenCV
        run: |
          $root = "C:\tools\opencv\build"
          $runtime = Get-ChildItem "$root\x64" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "OpenCV_DIR=$root" >> $env:GITHUB_ENV
          "$($runtime.FullName)\bin" >> $env:GITHUB_PATH

      - name: Install nlohmann-json (vcpkg)
        run: vcpkg install nlohmann-json:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Ready-to-run camera_probe for lab PCs (docs/hardware/camera-probe.md):
      # exe + OpenCV DLL + MSVC runtime DLLs side by side, so it runs from a
      # folder without admin rights or a VC++ redistributable install.
      - name: Bundle camera_probe
        run: |
          $dist = "dist\camera_probe"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\Release\camera_probe.exe $dist
          $runtime = Get-ChildItem "$env:OpenCV_DIR\x64" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          Get-ChildItem "$($runtime.FullName)\bin\opencv_world*.dll" |
            Where-Object { $_.Name -notmatch 'd\.dll$' } | Copy-Item -Destination $dist
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $crt) { throw "MSVC x64 CRT redist folder not found" }
          Copy-Item "$crt\*.dll" $dist
          Copy-Item docs\hardware\camera-probe.md "$dist\README.md"
          Get-ChildItem $dist | Format-Table Name, Length

      # Prove the bundle is self-contained: OpenCV taken off PATH, exe run from
      # the bundle. The runner has no camera, so success here is exit code 1
      # with "no camera delivered a frame"; a missing DLL would crash instead.
      - name: Smoke-test camera_probe bundle
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike 'C:\tools\opencv*' }) -join ';'
          $out = & .\dist\camera_probe\camera_probe.exe --max-index 1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 1 -or $out -notmatch 'no camera delivered a frame') { throw "unexpected result, exit code $code" }
          exit 0

      - name: Upload camera_probe bundle
        uses: actions/upload-artifact@v7
        with:
          name: camera_probe-windows
          path: dist/camera_probe
          if-no-files-found: error
          retention-days: 90
