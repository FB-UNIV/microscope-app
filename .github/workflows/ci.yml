name: CI

on:
  push:
    branches: [master, main]
    # A version tag builds the bundles release.yml publishes as that version.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC, distro OpenCV)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # qt6-qpa-plugins carries the offscreen platform plugin the app launch
      # test runs on; libqt6gui6 only recommends it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libopencv-dev nlohmann-json3-dev qt6-base-dev qt6-qpa-plugins \
            python3 python3-numpy python3-opencv

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build
        run: cmake --build build

      # Phase-analysis parity runs here on the in-repo legacy crops; the
      # full-size checks need the legacy TIFF archive (not in the repo), so
      # they print [SKIP] here and run locally with MSAPP_LEGACY_DATA_DIR.
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure --label-exclude e2e

      # The e2e pipeline: a whole lab session through the files the core
      # reads and writes (test_e2e_lab_session), then the real windows driven
      # offscreen on the replay camera (test_app_e2e).
      - name: End-to-end tests
        run: ctest --test-dir build --output-on-failure --label-regex e2e

      # ADR 0012: the numpy reference is a second, independent implementation
      # of the legacy algorithm. Its output on the in-repo crops is the golden
      # file test_phase_analysis reads, so a drift in either one fails here.
      - name: Check numpy reference against the golden file
        working-directory: tests/fixtures/legacy
        run: |
          python3 ../../../tools/legacy_phase_reference.py \
            CTTM1Ech1Vue1_crop256.png CTTM1Ech2Vue1_crop256.png CTTM1Ech3Vue1_crop256.png > "$RUNNER_TEMP/reference.txt"
          diff -u crops_reference.txt "$RUNNER_TEMP/reference.txt"

  # Line coverage of every test, the GUI end-to-end test included. The core
  # (src/, include/) is gated: it was 92.8 % covered on 2026-10-19, the gap
  # being mostly OpenCvCamera, which needs a real camera. The Qt app is
  # reported only until its own baseline is known.
  coverage:
    name: Coverage (GCC, gcovr)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libopencv-dev nlohmann-json3-dev qt6-base-dev qt6-qpa-plugins gcovr

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage -O0"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage report
        run: |
          mkdir -p coverage
          gcovr --root . --filter 'src/' --filter 'include/' --filter 'app/' --exclude 'app/tests/' \
            --html-details coverage/index.html --txt coverage/summary.txt --print-summary build
          { echo '```'; cat coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Core coverage gate (90 % of lines)
        run: gcovr --root . --filter 'src/' --filter 'include/' --fail-under-line 90 --print-summary build

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          retention-days: 30

  # Memory errors and undefined behaviour (out-of-bounds pixel access, signed
  # overflow, use-after-free across the camera thread) fail the build here.
  # Leak checks cover the core; the Qt tests run without them, as Qt and
  # fontconfig keep process-lifetime allocations LeakSanitizer reports.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libopencv-dev nlohmann-json3-dev qt6-base-dev qt6-qpa-plugins

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      # ASan's shadow memory does not fit with 32 bits of mmap randomisation
      # (kernels >= 6.5): tests then loop on "AddressSanitizer:DEADLYSIGNAL"
      # instead of running, as seen on WSL with kernel 6.18.
      - name: Reduce ASLR entropy for ASan
        run: sudo sysctl vm.mmap_rnd_bits=28

      # tests/lsan.supp names the third-party leaks (OpenCV's USB camera
      # probe); the full unwinder lets LeakSanitizer see those frames.
      - name: Core tests
        env:
          ASAN_OPTIONS: detect_leaks=1:fast_unwind_on_malloc=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/lsan.supp
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 300 --label-exclude gui

      - name: App tests
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 300 --label-regex gui

  windows:
    name: Windows (MSVC 2022, prebuilt OpenCV)
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      # Full history and tags: CMake stamps git describe (v0.1.0-3-gabc1234)
      # into the bundles, and release.yml names the zips after it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned: this job also builds the camera_probe bundle shipped to lab
      # PCs, so OpenCV must not change between two runs. Bump on purpose (and
      # the cache key with it).
      #
      # The Chocolatey feed often answers 503/504, which failed most Windows
      # runs on 2026-10-16/19: the extracted build is cached between runs,
      # and a cold install is retried with growing pauses.
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: C:\tools\opencv\build
          key: opencv-4.13.0-windows-build

      - name: Install OpenCV (official prebuilt binaries)
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            choco install opencv --version 4.13.0 --no-progress -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            $pause = 30 * $attempt
            Write-Host "choco install failed (attempt $attempt of 5), retrying in $pause s"
            Start-Sleep -Seconds $pause
          }
          exit 1

      - name: Locate OpenCV
        run: |
          $root = "C:\tools\opencv\build"
          $runtime = Get-ChildItem "$root\x64" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "OpenCV_DIR=$root" >> $env:GITHUB_ENV
          "OpenCV_BIN=$($runtime.FullName)\bin" >> $env:GITHUB_ENV
          "$($runtime.FullName)\bin" >> $env:GITHUB_PATH

      # Pinned like OpenCV: this job also builds the microscope_app bundle
      # shipped to lab PCs. Puts Qt (and windeployqt) on PATH for CMake and CTest.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install nlohmann-json (vcpkg)
        run: vcpkg install nlohmann-json:x64-windows

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure --label-exclude e2e

      - name: End-to-end tests
        run: ctest --test-dir build -C Release --output-on-failure --label-regex e2e

      # Both bundles ship the MSVC runtime DLLs beside the exe, so they run
      # from a folder without admin rights or a VC++ redistributable install.
      - name: Locate the MSVC runtime DLLs
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $crt) { throw "MSVC x64 CRT redist folder not found" }
          "MSVC_CRT=$crt" >> $env:GITHUB_ENV

      # Ready-to-run camera_probe for lab PCs (docs/hardware/camera-probe.md):
      # exe + OpenCV DLL + MSVC runtime DLLs side by side.
      - name: Bundle camera_probe
        run: |
          $dist = "dist\camera_probe"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\Release\camera_probe.exe $dist
          Get-ChildItem "$env:OpenCV_BIN\opencv_world*.dll" |
            Where-Object { $_.Name -notmatch 'd\.dll$' } | Copy-Item -Destination $dist
          Copy-Item "$env:MSVC_CRT\*.dll" $dist
          Copy-Item docs\hardware\camera-probe.md "$dist\README.md"
          Get-ChildItem $dist | Format-Table Name, Length

      # Prove the bundle is self-contained: OpenCV taken off PATH, exe run from
      # the bundle. The runner has no camera, so success here is exit code 1
      # with "no camera delivered a frame"; a missing DLL would crash instead.
      - name: Smoke-test camera_probe bundle
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notlike 'C:\tools\opencv*' }) -join ';'
          $out = & .\dist\camera_probe\camera_probe.exe --max-index 1 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 1 -or $out -notmatch 'no camera delivered a frame') { throw "unexpected result, exit code $code" }
          exit 0

      - name: Upload camera_probe bundle
        uses: actions/upload-artifact@v7
        with:
          name: camera_probe-windows
          path: dist/camera_probe
          if-no-files-found: error
          retention-days: 90

      # Ready-to-run microscope_app for lab PCs: windeployqt adds the Qt DLLs
      # and plugins (platforms\qwindows.dll above all); OpenCV and the MSVC
      # runtime are copied beside them as for camera_probe. No Qt translations
      # yet: they come with the French UI.
      - name: Bundle microscope_app
        run: |
          $dist = "dist\microscope_app"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build\app\Release\microscope_app.exe $dist
          windeployqt --release --no-translations --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler "$dist\microscope_app.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }
          Get-ChildItem "$env:OpenCV_BIN\opencv_world*.dll" |
            Where-Object { $_.Name -notmatch 'd\.dll$' } | Copy-Item -Destination $dist
          Copy-Item "$env:MSVC_CRT\*.dll" $dist
          Get-ChildItem $dist -Recurse -Name

      # Prove the bundle is self-contained: every PATH folder holding Qt or
      # OpenCV DLLs dropped, QT_PLUGIN_PATH cleared, exe run from the bundle on
      # the real Windows platform plugin. A missing DLL or plugin shows a
      # dialog instead of exiting, hence the timeout.
      - name: Smoke-test microscope_app bundle
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'Qt6Core.dll')) -and -not (Test-Path (Join-Path $_ 'opencv_world*.dll'))
          }) -join ';'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $app = Start-Process .\dist\microscope_app\microscope_app.exe -ArgumentList '--smoke-test' -PassThru
          $null = $app.Handle  # keeps ExitCode readable once the process has exited
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "microscope_app did not quit within 60 s" }
          if ($app.ExitCode -ne 0) { throw "microscope_app exited with code $($app.ExitCode)" }
          Write-Output "microscope_app launched from the bundle and quit cleanly"

      - name: Upload microscope_app bundle
        uses: actions/upload-artifact@v7
        with:
          name: microscope_app-windows
          path: dist/microscope_app
          if-no-files-found: error
          retention-days: 90
